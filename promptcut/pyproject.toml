[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcut"
version = "0.1.0"
description = "Prompt-driven video editor built for Claude Code: a JSON timeline compiled to ffmpeg."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.0"]

[project.scripts]
promptcut = "promptcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
promptcut = ["static/*"]
